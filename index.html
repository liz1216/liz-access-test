<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17130f">
    <title>LIZ · 私密访问测试</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./unlock.js"></script>
  </head>
  <body>
    <main class="shell">
      <section id="gate" class="card">
        <p class="eyebrow">PRIVATE ACCESS / 01</p>
        <h1>LIZ · 私密访问测试</h1>
        <p class="intro">输入测试密码，验证远程浏览器访问。此页尚未包含模型、素材或对话功能。</p>
        <form id="unlock-form">
          <label for="password">测试密码</label>
          <div class="input-row">
            <input id="password" type="password" autocomplete="current-password" required>
            <button id="unlock" type="submit">解锁</button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="unlocked" class="card" hidden>
        <div id="content"></div>
        <button id="lock" type="button">重新锁定</button>
      </section>
    </main>
  </body>
</html>
