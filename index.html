<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17130f">
    <title>LIZ · 美术预览</title>
    <link rel="stylesheet" href="./styles.css?v=d06f6c242cd1">
    <script type="module" src="./unlock.js?v=5f5f7ab3a0c1"></script>
  </head>
  <body>
    <main class="shell">
      <section id="gate" class="card">
        <p class="eyebrow">PRIVATE ACCESS / 01</p>
        <h1>LIZ · 美术预览</h1>
        <p class="intro">输入密码，进入素材预览工作台。首次打开需要加载模型，建议使用电脑。</p>
        <form id="unlock-form">
          <label for="password">访问密码</label>
          <div class="input-row">
            <input id="password" type="password" autocomplete="current-password" required>
            <button id="unlock" type="submit">解锁</button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="unlocked" class="card" hidden>
        <div id="content"></div>
        <div id="load-progress" role="status" aria-live="polite" hidden>
          <span id="load-message">正在准备工作台…</span>
          <progress id="asset-progress" max="100" value="0" aria-label="素材下载进度"></progress>
        </div>
        <button id="lock" type="button">重新锁定</button>
      </section>
    </main>
  </body>
</html>
